name: Bug report
description: Report a reproducible problem in Hermes Mobile
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail to reproduce it without private logs or secrets.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Describe the bug and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: hermes-version
    attributes:
      label: Hermes Agent / Dashboard version
      placeholder: e.g. v0.16.0
  - type: input
    id: pwa-version
    attributes:
      label: Hermes Mobile version
      placeholder: e.g. 0.1.0
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS Safari PWA
        - iOS Safari browser
        - Android Chrome PWA
        - Android Chrome browser
        - Desktop browser
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets, tokens, cookies, private URLs, and personal data before posting.
